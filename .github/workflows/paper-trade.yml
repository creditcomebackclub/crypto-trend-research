name: Daily paper targets

on:
  schedule:
    - cron: "35 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/paper_trade.py
      - name: Commit changed log only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/paper_log.csv
          git diff --cached --quiet || git commit -m "data: update daily paper targets"
          git push

